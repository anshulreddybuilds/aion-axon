[pytest]
# Tests live in tests/. Without this, a bare `pytest -q` also walks
# scripts/ and sandbox/, where a file named test_*.py is a manual probe
# rather than a test -- importing one runs it. CI has always passed
# `tests` explicitly, so CI was green while a bare `pytest -q` produced
# 121 errors; anyone cloning the repo hit the broken path, not the CI one.
# Making the default match what CI does removes that gap.
testpaths = tests
