name: AION-AXON CI

on:
  # Every branch, not just main. The parallel-session fleet uses CI as its
  # review gate instead of line-by-line reading, so a feature branch with
  # no CI is a branch with no review at all.
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AXON_FIRESTORE_MODE: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests
        run: python -m pytest -q tests
